# ICA 招新平台 — nginx 站点配置（唯一事实源，同步到 /etc/nginx/sites-available/ica.hub.tt2.li）
server {
    server_name ica.hub.tt2.li;
    root /root/workspace/test0607/clubshelp/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 构建产物（hash 文件名）长缓存
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # AI 生成素材直出
    location ^~ /assets/ {
        root /root/workspace/test0607/clubshelp;
        expires 7d;
        try_files $uri =404;
    }

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        # SSE 流式
        proxy_buffering off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ica.hub.tt2.li/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ica.hub.tt2.li/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name ica.hub.tt2.li;
    return 301 https://$host$request_uri;
}
