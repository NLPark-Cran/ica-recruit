[project]
name = "ica-backend"
version = "0.1.0"
description = "ICA 招新综合平台后端"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=7.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "pyjwt>=2.10",
    "cryptography>=46",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "mypy>=1.18",
    "aiosqlite>=0.21",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
